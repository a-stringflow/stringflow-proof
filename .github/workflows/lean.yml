name: Lean CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: lean
          build: true
          test: false
          lint: false
          mk_all-check: false
      - name: Axiom and Dependency Audit
        working-directory: lean
        run: |
          echo "=== Running Lean 4 Axiom and Dependency Audit ==="
          lake env lean AxiomAudit.lean > audit_output.txt 2>&1
          cat audit_output.txt
          if grep -q "sorryAx" audit_output.txt; then
            echo "ERROR: sorryAx detected in dependency closure!"
            exit 1
          fi
          echo "=== Axiom and Dependency Audit Passed ==="

